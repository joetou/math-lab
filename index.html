        <button id="video-play-btn" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.95);border:none;font-size:16px;cursor:pointer;">▶️</button>
      </div>
      <span style="position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.75); color:white; font-size:10px; padding:2px 6px; border-radius:8px;">0:42</span>
    </div>
    <div style="padding:10px 12px;">
      <span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:999px;font-weight:700;">📹 Step 2 畫圖</span>
      <div style="font-size:13px;font-weight:800;color:#1f2937;margin-top:6px;line-height:1.3;">如何用1段代表弟弟？</div>
      <div style="font-size:10px;color:#9ca3af;margin-top:4px;">數仔老師 · 看完+5分</div>
    </div>
  </div>
  <button id="video-minimize" style="font-size:11px;background:rgba(0,0,0,0.6);color:white;border:none;padding:4px 10px;border-radius:999px;cursor:pointer;">收起</button>
</div>

<div id="video-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:99999;align-items:center;justify-content:center;padding:16px;">
  <div style="background:white;border-radius:20px;max-width:420px;width:100%;overflow:hidden;">
    <div style="position:relative;background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;">
      <img src="teaching_cover.webp" style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'">
      <button id="video-close-btn" style="position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.6);color:white;border:none;font-size:18px;cursor:pointer;">✕</button>
      <div style="position:absolute;bottom:12px;left:12px;right:12px;background:rgba(0,0,0,0.7);color:white;padding:8px 12px;border-radius:12px;font-size:13px;">🎙️ 老師: 「審題先找誰比較少，把少的設為1段...」</div>
    </div>
    <div style="padding:16px;">
      <h3 style="margin:0;font-size:15px;font-weight:800;">Step 2 畫圖 - 線段圖的1段思維</h3>
      <p style="margin:8px 0 0;font-size:13px;color:#6b7280;">把文字變成圖，弟弟最少設為1段，哥哥2倍就是2段。</p>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="video-later" style="flex:1;padding:10px;border-radius:12px;background:#f3f4f6;border:none;font-weight:600;">稍後</button>
        <button id="video-done" style="flex:1;padding:10px;border-radius:12px;background:#f59e0b;color:white;border:none;font-weight:700;">學會了 ✓</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  function hideJsonDebug(){
    document.querySelectorAll('div, pre, code').forEach(function(el){
      var t = el.textContent || '';
      if(t.length < 600 && ((t.includes('base_px') && t.includes('multiplier')) || (t.includes('"step"') && t.includes('畫圖') && t.includes('base')))){
        if(!el.dataset.fixed){
          var friendly = document.createElement('div');
          friendly.id = 'kid-friendly-status';
          friendly.innerHTML = '<span style="font-size:20px;">✅</span><span>圖形已完成！<b>弟弟 1份 = 3本</b> + <b>哥哥 3份 = 9本</b> = <b>共 4份 = 12本</b></span>';
          if(el.parentNode){ el.parentNode.insertBefore(friendly, el); }
          el.style.display = 'none';
          el.dataset.fixed = '1';
        }
      }
    });
    // 修復15本顯示為12本
    document.querySelectorAll('*').forEach(function(el){
      if(el.childNodes.length === 1 && el.childNodes[0].nodeType === 3){
        var txt = el.textContent;
        if(txt && txt.match(/15\s*本\s*[=＝]\s*4\s*份/)){
          el.textContent = txt.replace(/15\s*本\s*[=＝]\s*4\s*份/, '12本 = 4份');
        }
      }
    });
  }
  function initVideo(){
    var modal=document.getElementById('video-modal');
    var play=document.getElementById('video-play-btn');
    var thumb=document.getElementById('video-thumb');
    var close=document.getElementById('video-close-btn');
    var later=document.getElementById('video-later');
    var done=document.getElementById('video-done');
    var minimize=document.getElementById('video-minimize');
    var card=document.getElementById('video-compact-card');
    var hidden=false;
    function open(){ if(modal) modal.style.display='flex'; }
    function closeM(){ if(modal) modal.style.display='none'; }
    if(play) play.onclick=open;
    if(thumb) thumb.onclick=open;
    if(close) close.onclick=closeM;
    if(later) later.onclick=closeM;
    if(done) done.onclick=function(){ closeM(); alert('獲得 專心聽講 勳章 +5分！'); };
    if(minimize) minimize.onclick=function(){ hidden=!hidden; if(card) card.style.display=hidden?'none':'block'; minimize.textContent=hidden?'展開視頻':'收起'; };
    if(modal) modal.onclick=function(e){ if(e.target===modal) closeM(); };
  }
  function init(){
    hideJsonDebug();
    initVideo();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  setInterval(hideJsonDebug, 1500);
  setTimeout(init, 800);
})();
</script>

</body>
</html>
